name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_parallel: 1
            test_parallel: 2
            configure_args: >-
              -DCMAKE_C_COMPILER_LAUNCHER=sccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            sccache_enabled: "true"
          - os: windows-latest
            build_parallel: 4
            test_parallel: 4
            configure_args: ""
            sccache_enabled: "false"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: ${{ matrix.sccache_enabled }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: dependencies-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache macOS compilation
        if: runner.os == 'macOS'
        uses: mozilla-actions/sccache-action@v0.0.11
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Configure
        run: >
          cmake -S . -B build
          -DSTUDIO_DUO_BUILD_TESTS=ON
          ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.build_parallel }}

      - name: Test
        run: >
          ctest --test-dir build
          --build-config Release
          --parallel ${{ matrix.test_parallel }}
          --output-on-failure
          --no-tests=error

      - name: Validate signed Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $passwordText = "studio-duo-ci-signing"
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $certificate = $null
          try {
            Write-Host "Creating in-memory CI code-signing certificate"
            $request =
              [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
                "CN=Studio Duo CI Test",
                $rsa,
                [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
              )
            $enhancedKeyUsages = [System.Security.Cryptography.OidCollection]::new()
            $enhancedKeyUsages.Add(
              [System.Security.Cryptography.Oid]::new("1.3.6.1.5.5.7.3.3")
            ) | Out-Null
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
                $enhancedKeyUsages,
                $false
              )
            )
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
                $false
              )
            )
            $certificate = $request.CreateSelfSigned(
              (Get-Date).AddMinutes(-5),
              (Get-Date).AddDays(1)
            )
            $certificateBase64 = [Convert]::ToBase64String(
              $certificate.Export(
                [System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
                $passwordText
              )
            )

            Write-Host "Building signed Windows test packages"
            & ./packaging/windows/build-release-packages.ps1 `
              -Version $version `
              -Executable "build/StudioDuo_artefacts/Release/Studio Duo.exe" `
              -OutputDirectory "$env:RUNNER_TEMP\studio-duo-windows-packages" `
              -CertificateBase64 $certificateBase64 `
              -CertificatePassword $passwordText `
              -TimestampUrl "" `
              -SkipTrustVerification
            & ./packaging/windows/test-installed-startup.ps1 `
              -Installer "$env:RUNNER_TEMP\studio-duo-windows-packages\Studio-Duo-$version-Windows-x64-Setup.exe"
          } finally {
            if ($null -ne $certificate) {
              $certificate.Dispose()
            }
            $rsa.Dispose()
          }

      - name: Upload Windows test packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-packages
          path: |
            ${{ runner.temp }}/studio-duo-windows-packages/*.exe
            ${{ runner.temp }}/studio-duo-windows-packages/*.zip
            build/StudioDuo_artefacts/Release/Studio Duo.pdb
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows startup failure logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-startup-failure-logs
          path: |
            ${{ runner.temp }}/studio-duo-install-smoke-*/**/*.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
