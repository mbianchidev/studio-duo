name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_parallel: 1
          - os: windows-latest
            build_parallel: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache JUCE source
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DSTUDIO_DUO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.build_parallel }}

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & ./packaging/windows/build-installer.ps1 `
            -Version $version `
            -Executable "build/StudioDuo_artefacts/Release/Studio Duo.exe" `
            -OutputDirectory "$env:RUNNER_TEMP\studio-duo-installer"
