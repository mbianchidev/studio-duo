name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test_executable: StudioDuoTests
            build_parallel: 2
            test_parallel: 2
            configure_args: >-
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
              -DSTUDIO_DUO_NATIVE_TESTS=ON
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          - os: windows-latest
            test_executable: StudioDuoTests.exe
            build_parallel: 4
            test_parallel: 4
            configure_args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.build_parallel }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'third_party/**/*.patch') }}

      - name: Install macOS compiler cache
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache

      - name: Cache macOS compilation
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: compilation-macOS-${{ runner.arch }}-ccache-${{ github.sha }}
          restore-keys: |
            compilation-macOS-${{ runner.arch }}-ccache-

      - name: Verify macOS compiler cache
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: ./scripts/check-macos-compiler-cache.sh

      - name: Configure
        run: >
          cmake -S . -B build
          -DSTUDIO_DUO_BUILD_TESTS=ON
          ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.build_parallel }}

      - name: Report macOS compilation cache
        if: always() && runner.os == 'macOS'
        run: ccache --show-stats

      - name: Test
        run: >
          ctest --test-dir build
          --build-config Release
          --parallel ${{ matrix.test_parallel }}
          --output-on-failure
          --no-tests=error
          --output-junit "${{ github.workspace }}/build/Testing/phase6-junit.xml"

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-hardening-${{ runner.os }}
          path: |
            build/Testing/phase6-junit.xml
            build/Testing/phase6-performance.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create native exchange fixture
        run: >
          cmake
          "-DTEST_BINARY=${{ github.workspace }}/build/StudioDuoTests_artefacts/Release/${{ matrix.test_executable }}"
          "-DOUTPUT_DIRECTORY=${{ github.workspace }}/build/phase6-exchange"
          -P cmake/StudioDuoExchangeFixture.cmake

      - name: Upload native exchange fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-exchange-${{ runner.os }}
          path: build/phase6-exchange
          if-no-files-found: error
          retention-days: 7

      - name: Validate macOS packages and installed startup
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          ./packaging/macos/build-release-packages.sh \
            "$version" \
            "build/StudioDuo_artefacts/Release/Studio Duo.app" \
            build/phase6-packages --universal

      - name: Upload macOS test packages
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-packages
          path: build/phase6-packages/Studio-Duo-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate signed Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $passwordText = "studio-duo-ci-signing"
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $certificate = $null
          try {
            Write-Host "Creating in-memory CI code-signing certificate"
            $request =
              [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
                "CN=Studio Duo CI Test",
                $rsa,
                [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
              )
            $enhancedKeyUsages = [System.Security.Cryptography.OidCollection]::new()
            $enhancedKeyUsages.Add(
              [System.Security.Cryptography.Oid]::new("1.3.6.1.5.5.7.3.3")
            ) | Out-Null
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
                $enhancedKeyUsages,
                $false
              )
            )
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
                $false
              )
            )
            $certificate = $request.CreateSelfSigned(
              (Get-Date).AddMinutes(-5),
              (Get-Date).AddDays(1)
            )
            $certificateBase64 = [Convert]::ToBase64String(
              $certificate.Export(
                [System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
                $passwordText
              )
            )

            Write-Host "Building signed Windows test packages"
            & ./packaging/windows/build-release-packages.ps1 `
              -Version $version `
              -Executable "build/StudioDuo_artefacts/Release/Studio Duo.exe" `
              -OutputDirectory "$env:RUNNER_TEMP\studio-duo-windows-packages" `
              -CertificateBase64 $certificateBase64 `
              -CertificatePassword $passwordText `
              -TimestampUrl "" `
              -TrustSigningCertificate
            if (Test-Path -LiteralPath "Cert:\LocalMachine\Root\$($certificate.Thumbprint)") {
              throw "Packaging left the ephemeral signing certificate trusted"
            }
            & ./packaging/windows/test-installed-startup.ps1 `
              -Installer "$env:RUNNER_TEMP\studio-duo-windows-packages\Studio-Duo-$version-Windows-x64-Setup.exe"
          } finally {
            if ($null -ne $certificate) {
              $certificate.Dispose()
            }
            $rsa.Dispose()
          }

      - name: Upload Windows test packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-packages
          path: |
            ${{ runner.temp }}/studio-duo-windows-packages/*.exe
            ${{ runner.temp }}/studio-duo-windows-packages/*.zip
            build/StudioDuo_artefacts/Release/Studio Duo.pdb
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows startup failure logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-startup-failure-logs
          path: |
            ${{ runner.temp }}/studio-duo-install-smoke-*/**/*.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  cross-platform-exchange:
    needs: build-and-test
    uses: ./.github/workflows/project-exchange.yml
