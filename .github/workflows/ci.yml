name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_parallel: 1
          - os: windows-latest
            build_parallel: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache JUCE source
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DSTUDIO_DUO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.build_parallel }}

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Validate signed Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $passwordText = "studio-duo-ci-signing"
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          Write-Host "Creating CI code-signing certificate"
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Studio Duo CI Test" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddDays(1)
          $pfxPath = Join-Path $env:RUNNER_TEMP "studio-duo-ci-signing.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "studio-duo-ci-signing.cer"

          try {
            Write-Host "Exporting and trusting CI code-signing certificate"
            Export-PfxCertificate `
              -Cert $certificate `
              -FilePath $pfxPath `
              -Password $password | Out-Null
            Export-Certificate `
              -Cert $certificate `
              -FilePath $cerPath | Out-Null
            Import-Certificate `
              -FilePath $cerPath `
              -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
            $certificateBase64 = [Convert]::ToBase64String(
              [IO.File]::ReadAllBytes($pfxPath)
            )

            Write-Host "Building signed Windows test packages"
            & ./packaging/windows/build-release-packages.ps1 `
              -Version $version `
              -Executable "build/StudioDuo_artefacts/Release/Studio Duo.exe" `
              -OutputDirectory "$env:RUNNER_TEMP\studio-duo-windows-packages" `
              -CertificateBase64 $certificateBase64 `
              -CertificatePassword $passwordText `
              -TimestampUrl ""
          } finally {
            Remove-Item `
              "Cert:\CurrentUser\My\$($certificate.Thumbprint)" `
              -Force `
              -ErrorAction SilentlyContinue
            Remove-Item `
              "Cert:\CurrentUser\Root\$($certificate.Thumbprint)" `
              -Force `
              -ErrorAction SilentlyContinue
            Remove-Item $pfxPath, $cerPath -Force -ErrorAction SilentlyContinue
          }
