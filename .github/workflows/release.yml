name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS DMG
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: release-macos-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure universal build
        run: >
          cmake -S . -B build -G Xcode
          -DSTUDIO_DUO_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release --parallel 1

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package DMG
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          app="build/StudioDuo_artefacts/Release/Studio Duo.app"
          staging="$RUNNER_TEMP/Studio Duo"
          output="Studio-Duo-${VERSION}-macOS-universal.dmg"

          test -d "$app"
          rm -rf "$staging"
          mkdir -p "$staging"
          ditto "$app" "$staging/Studio Duo.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "Studio Duo $VERSION" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "$output"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: Studio-Duo-${{ needs.validate.outputs.version }}-macOS-universal.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build signed Windows packages
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: release-windows-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DSTUDIO_DUO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Build signed Windows packages
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $executable = "build/StudioDuo_artefacts/Release/Studio Duo.exe"
          $staging = Join-Path $env:RUNNER_TEMP "Studio-Duo-$env:VERSION-Windows-x64"
          $zipOutput = "Studio-Duo-$env:VERSION-Windows-x64.zip"
          $setupOutput = "Studio-Duo-$env:VERSION-Windows-x64-Setup.exe"
          $certificatePath = Join-Path $env:RUNNER_TEMP "studio-duo-signing.pfx"

          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Studio Duo executable was not produced at $executable"
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not configured"
          }

          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw "The Windows SDK SignTool executable is unavailable"
          }

          function Sign-Artifact {
            param([Parameter(Mandatory = $true)][string] $Path)

            & $signTool.FullName sign `
              /f $certificatePath `
              /p $env:CERTIFICATE_PASSWORD `
              /fd SHA256 `
              /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /d "Studio Duo" `
              /du "https://github.com/mbianchidev/studio-duo" `
              $Path
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed for $Path"
            }

            & $signTool.FullName verify /pa /v $Path
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $Path"
            }
          }

          try {
            $certificateBytes = [Convert]::FromBase64String(
              ($env:CERTIFICATE_BASE64 -replace "\s", "")
            )
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

            Sign-Artifact $executable
            & ./packaging/windows/build-installer.ps1 `
              -Version $env:VERSION `
              -Executable $executable `
              -OutputDirectory (Get-Location).Path
            if (-not (Test-Path $setupOutput -PathType Leaf)) {
              throw "Windows installer was not produced at $setupOutput"
            }
            Sign-Artifact $setupOutput

            New-Item -ItemType Directory -Path $staging -Force | Out-Null
            Copy-Item $executable (Join-Path $staging "Studio Duo.exe")
            Copy-Item "README.md", "LICENSE" $staging
            Compress-Archive -Path $staging -DestinationPath $zipOutput -Force
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            Studio-Duo-${{ needs.validate.outputs.version }}-Windows-x64.zip
            Studio-Duo-${{ needs.validate.outputs.version }}-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum Studio-Duo-* > SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Studio Duo $VERSION"
          fi
