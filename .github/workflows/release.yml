name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS packages
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: release-macos-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure universal build
        run: >
          cmake -S . -B build -G Xcode
          -DSTUDIO_DUO_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release --parallel 1

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package macOS release
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          app="build/StudioDuo_artefacts/Release/Studio Duo.app"
          staging="$RUNNER_TEMP/Studio Duo"
          output="Studio-Duo-${VERSION}-macOS-universal.dmg"
          update_output="Studio-Duo-${VERSION}-macOS-universal.zip"

          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "$update_output"
          rm -rf "$staging"
          mkdir -p "$staging"
          ditto "$app" "$staging/Studio Duo.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "Studio Duo $VERSION" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "$output"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            Studio-Duo-${{ needs.validate.outputs.version }}-macOS-universal.dmg
            Studio-Duo-${{ needs.validate.outputs.version }}-macOS-universal.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build signed Windows packages
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: release-windows-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DSTUDIO_DUO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Build signed Windows packages
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not configured"
          }
          & ./packaging/windows/build-release-packages.ps1 `
            -Version $env:VERSION `
            -Executable "build/StudioDuo_artefacts/Release/Studio Duo.exe" `
            -OutputDirectory (Get-Location).Path `
            -CertificateBase64 $env:CERTIFICATE_BASE64 `
            -CertificatePassword $env:CERTIFICATE_PASSWORD `
            -SkipTrustVerification
          & ./packaging/windows/test-installed-startup.ps1 `
            -Installer "Studio-Duo-$env:VERSION-Windows-x64-Setup.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            Studio-Duo-${{ needs.validate.outputs.version }}-Windows-x64.zip
            Studio-Duo-${{ needs.validate.outputs.version }}-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum Studio-Duo-* > SHA256SUMS.txt

      - name: Create update manifest
        working-directory: dist
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mac_asset="Studio-Duo-${VERSION}-macOS-universal.zip"
          windows_asset="Studio-Duo-${VERSION}-Windows-x64-Setup.exe"
          test -f "$mac_asset"
          test -f "$windows_asset"

          mac_sha="$(sha256sum "$mac_asset" | cut -d ' ' -f 1)"
          windows_sha="$(sha256sum "$windows_asset" | cut -d ' ' -f 1)"
          mac_size="$(stat -c '%s' "$mac_asset")"
          windows_size="$(stat -c '%s' "$windows_asset")"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_base="https://github.com/${REPOSITORY}/releases"

          jq -n \
            --arg version "$VERSION" \
            --arg publishedAt "$published_at" \
            --arg releaseNotesUrl "${release_base}/tag/${TAG}" \
            --arg macUrl "${release_base}/download/${TAG}/${mac_asset}" \
            --arg macFileName "$mac_asset" \
            --arg macSha256 "$mac_sha" \
            --argjson macSizeBytes "$mac_size" \
            --arg windowsUrl "${release_base}/download/${TAG}/${windows_asset}" \
            --arg windowsFileName "$windows_asset" \
            --arg windowsSha256 "$windows_sha" \
            --argjson windowsSizeBytes "$windows_size" \
            '{
              schemaVersion: 1,
              version: $version,
              publishedAt: $publishedAt,
              releaseNotesUrl: $releaseNotesUrl,
              platforms: {
                macos: {
                  url: $macUrl,
                  fileName: $macFileName,
                  sha256: $macSha256,
                  sizeBytes: $macSizeBytes
                },
                windows: {
                  url: $windowsUrl,
                  fileName: $windowsFileName,
                  sha256: $windowsSha256,
                  sizeBytes: $windowsSizeBytes
                }
              }
            }' > update-manifest.json

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Studio Duo $VERSION"
          fi
