<!--
THESIS: Studio Duo is precision audio work for two channels and many layers; the mark refuses guitars, skulls, and generic play buttons.
OWN-WORLD: Near-black studio hardware, warm off-white structure, ember-orange signal, mint-green return path, strict rounded geometry.
STORY: A stable D-shaped chassis contains two independent waveforms that meet at one exact edit point.
FIRST VIEWPORT: One bold symbol fills the square with generous optical padding and survives at 16 pixels.
FORM: Engineered monogram, first-choice precision direction; the D is Duo, the paired signals are Studio.
-->
