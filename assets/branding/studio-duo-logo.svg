<!--
THESIS: Studio Duo is precision audio work for two channels and many layers; the identity refuses genre cliches and generic media controls.
OWN-WORLD: Near-black studio hardware, off-white technical lettering, ember-orange signal, mint-green return path, disciplined spacing.
STORY: The dual waveform monogram leads into a calm, professional wordmark built for a native production tool.
FIRST VIEWPORT: Symbol left, Studio Duo wordmark right, with the paired-channel motif carrying the brand at every scale.
FORM: Horizontal engineered wordmark extending the selected precision direction.
-->
