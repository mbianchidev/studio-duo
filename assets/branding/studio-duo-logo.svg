<!--
THESIS: Studio Duo is precision audio work reduced to one unmistakable signal; the identity refuses initials, genre cliches, and media-control symbols.
OWN-WORLD: Near-black studio hardware, off-white technical lettering, intense signal red, and disciplined spacing.
STORY: A singular engineered waveform leads into a calm professional wordmark built for a native production tool.
FIRST VIEWPORT: Signal mark left and Studio Duo wordmark right, with no enclosing letterform.
FORM: Horizontal distilled waveform wordmark following the user's simplified direction.
-->
